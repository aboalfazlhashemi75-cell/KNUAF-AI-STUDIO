name: Build KNUAF AI STUDIO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android API 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q KNUAF_AI_STUDIO_V2_GitHub_APK_Builder.zip.zip -d extracted

          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.knaufhashemi .

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Configure all modules to compile SDK 36
        run: |
          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          app = project / "android" / "app"

          def update_gradle(path):
              content = path.read_text()

              updated, count = re.subn(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)",
                  r"\g<1>36",
                  content
              )

              if count:
                  path.write_text(updated)
                  print("Updated:", path)

              return count

          app_files = (
              list(app.glob("build.gradle")) +
              list(app.glob("build.gradle.kts"))
          )

          if not app_files:
              raise SystemExit("App Gradle file not found")

          app_changes = sum(update_gradle(p) for p in app_files)

          if app_changes == 0:
              raise SystemExit("Could not update app compileSdk")

          cache = Path.home() / ".pub-cache"
          plugin_changes = 0

          if cache.exists():
              gradle_files = (
                  list(cache.rglob("build.gradle")) +
                  list(cache.rglob("build.gradle.kts"))
              )

              for path in gradle_files:
                  if path.parent.name == "android":
                      plugin_changes += update_gradle(path)

          print("App compileSdk updated.")
          print("Plugin Gradle changes:", plugin_changes)
          PY

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/output/KNUAF-AI-STUDIO.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KNUAF-AI-STUDIO-APK
          path: output/KNUAF-AI-STUDIO.apk
          if-no-files-found: error
