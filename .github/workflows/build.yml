name: Build KNUAF AI STUDIO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q KNUAF_AI_STUDIO_V2_GitHub_APK_Builder.zip -d extracted

          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.knaufhashemi .

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Configure all Android modules to API 36
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          android = Path(os.environ["PROJECT_DIR"]) / "android"
          app = android / "app"

          app_files = (
              list(app.glob("build.gradle")) +
              list(app.glob("build.gradle.kts"))
          )

          if not app_files:
              raise SystemExit("App Gradle file not found")

          for path in app_files:
              content = path.read_text()
              content = re.sub(
                  r"flutter\.compileSdkVersion",
                  "36",
                  content
              )
              path.write_text(content)

          root_gradle = android / "build.gradle"

          if not root_gradle.exists():
              raise SystemExit("Root android/build.gradle not found")

          content = root_gradle.read_text()

          marker = "KNUAF_FORCE_COMPILE_SDK_36"

          if marker not in content:
              content += """

          // KNUAF_FORCE_COMPILE_SDK_36
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          """

              root_gradle.write_text(content)

          print("All Android modules configured for API 36")
          PY

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/output/KNUAF-AI-STUDIO.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KNUAF-AI-STUDIO-APK
          path: output/KNUAF-AI-STUDIO.apk
          if-no-files-found: error
          
