name: Build KNUAF AI STUDIO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --org com.knuafhashemi .

      - name: Add Android Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          content = path.read_text(encoding="utf-8")

          permission = (
              '<uses-permission '
              'android:name="android.permission.INTERNET"/>'
          )

          if permission not in content:
              position = content.find(">")

              if position == -1:
                  raise Exception("Invalid AndroidManifest.xml")

              content = (
                  content[:position + 1]
                  + "\n    "
                  + permission
                  + content[position + 1:]
              )

              path.write_text(
                  content,
                  encoding="utf-8"
              )

          print("INTERNET permission is enabled")
          PY

      - name: Verify Internet Permission
        run: |
          grep "android.permission.INTERNET" \
          android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          KNUAF_API_URL: ${{ vars.KNUAF_API_URL }}
        run: |
          flutter build apk --release \
            --dart-define=KNUAF_API_URL="${KNUAF_API_URL:-https://knuaf-ai-studio.fastapicloud.dev}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KNUAF-AI-STUDIO-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
