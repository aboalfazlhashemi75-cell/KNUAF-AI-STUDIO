
name: Build KNUAF AI STUDIO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q KNUAF_AI_STUDIO_V2_GitHub_APK_Builder.zip -d extracted
          PUBSPEC=$(find extracted -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PUBSPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android --org com.knaufhashemi .

      - name: Set Android compile SDK 36
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"]) / "android/app"
          files = list(root.glob("build.gradle")) + list(root.glob("build.gradle.kts"))

          if not files:
              raise SystemExit("Android app Gradle file not found")

          changed = False

          for path in files:
              content = path.read_text()
              updated, count = re.subn(
                  r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=)?\s*)flutter\.compileSdkVersion\b",
                  r"\g<1>36",
                  content
              )
              if count:
                  path.write_text(updated)
                  changed = True

          if not changed:
              raise SystemExit("Could not find Flutter compileSdk setting")
          PY

      - name: Get dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/output/KNUAF-AI-STUDIO.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KNUAF-AI-STUDIO-APK
          path: output/KNUAF-AI-STUDIO.apk
          
